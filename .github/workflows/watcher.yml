name: Auto Scheduler watcher

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes (GitHub may delay a little)
  workflow_dispatch:           # lets you press "Run workflow" to test instantly

permissions:
  contents: write              # needed to save alerted.txt

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ShowTix
        env:
          SITE_URL:     ${{ vars.SITE_URL }}
          NTFY_TOPIC:   ${{ secrets.NTFY_TOPIC }}
          TWILIO_SID:   ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM:  ${{ secrets.TWILIO_FROM }}
          MY_PHONE:     ${{ secrets.MY_PHONE }}
        run: python watcher.py
      - name: Save alert memory
        run: |
          git config user.name "auto-scheduler-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A alerted.txt || true
          git diff --cached --quiet || (git commit -m "watcher state" && git push)
