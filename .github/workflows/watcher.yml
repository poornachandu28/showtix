name: Auto Scheduler watcher

on:
  push:
    branches: [main]
    paths:
      - "status.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firebase library
        run: pip install firebase-admin
      - name: Check all watches
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python watcher.py
