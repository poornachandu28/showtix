<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="10">
<title>ShowTix - test booking site</title>
<style>body{font-family:Arial,sans-serif;max-width:480px;margin:40px auto;padding:0 16px;color:#1a1a1a}
.box{padding:16px;border-radius:8px;font-size:18px}.closed{background:#fde8e8;color:#b91c1c}.open{background:#e7f8ee;color:#15803d}
small{color:#777}</style></head><body>
<h1>ShowTix</h1><p><small>Fake test site for the Auto Scheduler prototype. Not a real booking site.</small></p>
<h2 id="title">Loading...</h2><div id="status" class="box">Checking...</div>
<script>
function show(s,msg){
 document.getElementById('title').textContent=(s.movie||'Pushpa 3')+' · '+(s.theatre||'PVR Hyderabad')+' · '+(s.show||'9:30 PM');
 var b=document.getElementById('status');
 b.className='box '+(s.open?'open':'closed');
 b.textContent=msg||(s.open?'Bookings OPEN!':'Bookings not open yet');}
try{
 var x=new XMLHttpRequest();
 x.open('GET','status.json?t='+Date.now());
 x.onload=function(){try{show(JSON.parse(x.responseText))}catch(e){show({},'Status file not found. It will load once the site is on GitHub Pages.')}};
 x.onerror=function(){show({},'Status file not found. It will load once the site is on GitHub Pages.')};
 x.send();
}catch(e){show({},'Status file not found. It will load once the site is on GitHub Pages.')}
</script></body></html>
